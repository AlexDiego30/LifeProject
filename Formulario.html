    <section>
        <article>
            <form method="post" action="Formulario.php" autocomplete="off">
                <h3><strong>Datos Personales</strong></h3>
                <div class="form-group row">
                    <label for="nombre" class="col-sm-2 col-form-label">Nombre</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" name="nombre" id="nombre" placeholder="Nombre" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="apellido" class="col-sm-2 col-form-label">Apellido</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" name="apellido" id="apellido" placeholder="Apellido" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="edad" class="col-sm-2 col-form-label">Edad</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" name="edad" id="edad" placeholder="Edad"min="1" max="120" required>
                    </div>
                </div>
                <fieldset class="form-group">
                    <div class="row">
                        <legend class="col-form-label col-sm-2 pt-0">Sexo</legend>
                        <div class="col-sm-10">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="sexo" id="sexo" value="masculino"required>
                                <label class="form-check-label" for="masculino">Masculino</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="sexo" id="sexo" value="femenino" required>
                                <label class="form-check-label" for="femenino">Femenino</label>
                            </div>
                        </div>
                    </div>
                </fieldset>
                <h3><strong>Nivel Academico</strong></h3>
                <div class="form-group row">
                    <label for="estudios" class="col-sm-2 col-form-label">Nivel Academico</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="estudios" name="estudios" required>
                            <option value="primaria">Primaria</option>
                            <option value="secundaria">Secundaria</option>
                            <option value="bachillerato">Bachillerato</option>
                            <option value="licenciatura">Licenciatura</option>
                        </select>
                    </div>
                </div>
                <h3><strong>Verificacion</strong></h3>
                <div class="form-group row">
                    <label for="usuario" class="col-sm-2 col-form-label">Usuario</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" name="usuario" id="usuario" placeholder="Usuario" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="password" class="col-sm-2 col-form-label">Contraseña</label>
                    <div class="col-sm-10">
                        <input type="password" class="form-control" name="password" id="password" placeholder="Contraseña" maxlength="6" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="passwordConfirm" class="col-sm-2 col-form-label">Verificar Contraseña</label>
                    <div class="col-sm-10">
                        <input type="password" class="form-control"  name="passwordConfirm" id="passwordConfirm" placeholder="Verificar Contraseña" maxlength="6" required>
                    </div>
                </div>
                <div class="form-group row">
                    <div class="col-sm-10">
                        <button type="submit" class="btn btn-primary">Enviar</button>
                    </div>
                </div>
            </form>
        </article>
