    <section>
        <article>
            <form method="post" action="Form_libro.php" autocomplete="off">
                <h3><strong>Información del Libro</strong></h3>
                <div class="form-group row">
                    <label for="titulo" class="col-sm-2 col-form-label">Título</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" maxlength="255" name="titulo" id="titulo" placeholder="Título" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="autor" class="col-sm-2 col-form-label">Autor</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" maxlength="255" name="autor" id="autor" placeholder="Autor" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="genero" class="col-sm-2 col-form-label">Género</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" maxlength="100" name="genero" id="genero" placeholder="Género" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="anio" class="col-sm-2 col-form-label">Año de Publicación</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" name="anio" id="anio" placeholder="Año"  required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="editorial" class="col-sm-2 col-form-label">Editorial</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" maxlength="100" name="editorial" id="editorial" placeholder="Editorial" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="idioma" class="col-sm-2 col-form-label">Idioma</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" maxlength="50" name="idioma" id="idioma" placeholder="Idioma" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="paginas" class="col-sm-2 col-form-label">Número de Páginas</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" name="paginas" id="paginas" placeholder="Páginas" min="1" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="isbn" class="col-sm-2 col-form-label">ISBN</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" maxlength="20" minlength="20" name="isbn" id="isbn" placeholder="ISBN" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="formato" class="col-sm-2 col-form-label">Formato</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="formato" name="formato" required>
                            <option value="fisico">Físico</option>
                            <option value="digital">Digital</option>
                            <option value="audiolibro">Audiolibro</option>
                        </select>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="resumen" class="col-sm-2 col-form-label">Resumen</label>
                    <div class="col-sm-10">
                        <textarea class="form-control" name="resumen" id="resumen" rows="3" placeholder="Resumen" required></textarea>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="valoracion" class="col-sm-2 col-form-label">Valoración</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" name="valoracion" id="valoracion" placeholder="Valoración (1-5)" min="1" max="5" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="precio" class="col-sm-2 col-form-label">Precio</label>
                    <div class="col-sm-10">
                        <input type="number" class="form-control" name="precio" id="precio" placeholder="Precio" step="0.01" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="estado" class="col-sm-2 col-form-label">Estado del Libro</label>
                    <div class="col-sm-10">
                        <select class="form-control" name="estado" id="estado" required>
                            <option value="nuevo">Nuevo</option>
                            <option value="segunda_mano">Segunda Mano</option>
                        </select>
                    </div>
                </div>                
                <div class="form-group row">
                    <label for="clasificacion" class="col-sm-2 col-form-label">Clasificación por Edades</label>
                    <div class="col-sm-10">
                        <select class="form-control" name="clasificacion" id="clasificacion" required>
                            <option value="todos">Para todos</option>
                            <option value="7+">Mayores de 7 años</option>
                            <option value="12+">Mayores de 12 años</option>
                            <option value="16+">Mayores de 16 años</option>
                            <option value="18+">Mayores de 18 años</option>
                        </select>
                    </div>
                </div>                
                <div class="form-group row">
                    <label for="disponibilidad" class="col-sm-2 col-form-label">Disponibilidad</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="disponibilidad" name="disponibilidad" required>
                            <option value="disponible">Disponible</option>
                            <option value="no_disponible">No Disponible</option>
                            <option value="proximo">Próximamente</option>
                        </select>
                    </div>
                </div>
                <div class="form-group row">
                    <div class="col-sm-10">
                        <button type="submit" class="btn btn-primary">Enviar</button>
                    </div>
                </div>
            </form>

<script>
    document.getElementById('anio').addEventListener('input', function (e) {
        if (this.value.length > 4) {
            this.value = this.value.slice(0, 4); // Limita a 4 dígitos
        }
    });
</script>
<script>
    document.getElementById('valoracion').addEventListener('input', function (e) {
        let valor = this.value;
        
        // Permitir solo un carácter (1-5)
        if (valor.length > 1) {
            this.value = valor.slice(0, 1);
        }

        // Asegurar que el valor esté dentro del rango 1-5
        if (valor < 1 || valor > 5) {
            this.value = '';
        }
    });
</script>
